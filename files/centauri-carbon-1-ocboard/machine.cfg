# -----
# PLEASE DO NOT EDIT THIS FILE. EDIT printer.cfg INSTEAD.
# UPDATES WILL RESET THIS FILE. YOUR EDITS WILL BE LOST WHEN UPDATING.
# -----

[mcu]
restart_method: command

[force_move]
enable_force_move: True

[mcu bed]
baud: 250000
restart_method: command
is_non_critical: true

[mcu hotend]
restart_method: command

[printer]
kinematics: corexy
max_velocity: 500
max_accel: 20000
max_z_velocity: 20
max_z_accel: 500
square_corner_velocity: 9

[gcode_arcs]
resolution: 0.5

[pause_resume]

[exclude_object]

[idle_timeout]
gcode: _IDLE_TIMEOUT
timeout: 1800

[virtual_sdcard]
path: /etc/klipper/gcodes

[danger_options]
multi_mcu_trsync_timeout: 0.03
log_pressure_advance_changes: False
log_velocity_limit_changes: False

[stepper_x]
step_pin: PB15
dir_pin: !PB12
enable_pin: !PB14
endstop_pin: tmc2209_stepper_x:virtual_endstop
microsteps: 16
full_steps_per_rotation: 200
position_endstop: 256
position_max: 256
position_min: -2
homing_speed: 80
homing_retract_dist: 20
rotation_distance: 39.872
homing_accel:5000

[tmc2209 stepper_x]
uart_pin: PC4
uart_address: 0
interpolate: true
run_current: 1
home_current: 0.8
coolstep_threshold: 29.904
driver_MULTISTEP_FILT: true
driver_IHOLDDELAY: 12
driver_TBL: 1
driver_TOFF: 1
driver_HSTRT: 2
driver_HEND: 3
driver_PWM_AUTOSCALE: true
driver_PWM_AUTOGRAD: true
driver_PWM_FREQ: 2
driver_PWM_GRAD: 15
driver_PWM_OFS: 18
driver_PWM_REG: 15
driver_PWM_LIM: 4
driver_SEMIN: 2
driver_SEMAX: 4
driver_SEUP: 3
driver_SEDN: 2
driver_SEIMIN: 1
driver_SGTHRS: 130

sense_resistor: 0.11
diag_pin: PE14

[stepper_y]
step_pin: PD10
dir_pin: !PD12
enable_pin: !PB13
endstop_pin: tmc2209_stepper_y:virtual_endstop
microsteps: 16
full_steps_per_rotation: 200
position_endstop: -2
position_max: 265
position_min: -2
homing_speed: 80
homing_retract_dist: 30
rotation_distance: 39.872
homing_accel:5000

[tmc2209 stepper_y]
uart_pin: PC7
interpolate: true
run_current: 1.0
home_current: 0.8
coolstep_threshold: 29.904
driver_MULTISTEP_FILT: true
driver_IHOLDDELAY: 12
driver_TBL: 1
driver_TOFF: 1
driver_HSTRT: 2
driver_HEND: 3
driver_PWM_AUTOSCALE: true
driver_PWM_AUTOGRAD: true
driver_PWM_FREQ: 2
driver_PWM_GRAD: 15
driver_PWM_OFS: 18
driver_PWM_REG: 15
driver_PWM_LIM: 4
driver_SEMIN: 2
driver_SEMAX: 4
driver_SEUP: 3
driver_SEDN: 2
driver_SEIMIN: 1
driver_SGTHRS: 130

sense_resistor: 0.11
diag_pin: PE15

[stepper_z]
step_pin: PD9
dir_pin: !PD14
enable_pin: !PD8
endstop_pin: !PE2
rotation_distance: 8
microsteps: 16
full_steps_per_rotation: 200
position_endstop: 4
position_max: 258
position_min: -4
homing_speed: 8
homing_retract_dist: 10
homing_retract_speed: 6
second_homing_speed: 2

[tmc2209 stepper_z]
uart_pin: PC6
interpolate: true
run_current: 0.8
driver_sgthrs: 130

sense_resistor: 0.11

[extruder]
step_pin: hotend:PC13
dir_pin: hotend:PC14
enable_pin: !hotend:PC15
heater_pin: hotend:PB6
sensor_pin: hotend:PA3
microsteps: 16
full_steps_per_rotation: 200
gear_ratio: 52:10
rotation_distance: 28.8 #could be 27.3 needs more testing 28.8 default
nozzle_diameter: 0.4
filament_diameter: 1.75
sensor_type: hotend_thermistor
smooth_time: 1.5
min_temp: 0
max_temp: 335
min_extrude_temp: 180
pressure_advance: 0.04
pressure_advance_smooth_time: 0.04
max_extrude_only_distance: 500 #was 150, for purging
max_extrude_cross_section: 5
control: pid
pid_Kp: 24.860427
pid_Ki: 2.702253
pid_Kd: 57.178292

[tmc2209 extruder]
tx_pin: hotend:PC6
uart_pin: hotend:PC7
interpolate: true
run_current: 0.7
uart_address: 3
sense_resistor: 0.1

[verify_heater extruder]

[thermistor hotend_thermistor]
temperature1: 25
resistance1: 100000
beta: 4300

[heater_fan extruder]
pin: hotend:PC8
tachometer_pin: hotend:PA1
tachometer_poll_interval: 0.001

[fan]
pin: hotend:PB5
tachometer_pin: hotend:PA0

[lis2dw]
spi_speed: 5000000
cs_pin: hotend:PA4
spi_bus: spi1
axes_map: x,z,-y

[input_shaper]
damping_ratio_x: 0.06
damping_ratio_y: 0.082

[resonance_tester]
probe_points: 128,128,20
accel_chip: lis2dw
min_freq: 10
max_freq: 100
accel_per_hz: 100
hz_per_sec: 2

[heater_bed]
heater_pin: PA1
sensor_pin: PA0
sensor_type: Generic 3950
min_temp: 0
max_temp: 125
control: pid
pid_Kp: 46.504839
pid_Ki: 1.453276
pid_Kd: 372.038710

[verify_heater heater_bed]

[bed_mesh]
speed: 150
horizontal_move_z: 2
mesh_min: 10,10
mesh_max: 246,246
probe_count: 9,9
mesh_pps: 3,3
algorithm: bicubic
adaptive_margin: 3
zero_reference_position: 128, 128
move_check_distance: 3.0
split_delta_z: 0.01
horizontal_z_clearance: 0.4

[load_cell_probe]
sensor_type: hx711s
dout_pins: bed:PB14, bed:PC8, bed:PB15, bed:PA8
sclk_pins: bed:PB13, bed:PC7, bed:PC6,  bed:PC9
sensor_orientation: inverted
sample_rate: 80
gain: A-128
speed: 2.0
sample_retract_dist: 0.5
lift_speed: 10.0
counts_per_gram: 105
reference_tare_counts: 71000, 71000, 71000, 71000
z_offset: 0.0
pullback_distance: 0.4
pullback_speed: 1.0
samples_tolerance: 0.05
samples_tolerance_retries: 3

[filament_switch_sensor filament_sensor]
switch_pin: PC0
pause_on_runout: false
debounce_delay: 1
runout_distance: 770
smart: true
runout_gcode:
  {% if not printer["filament_switch_sensor filament_sensor"].filament_detected %}
    RESPOND MSG="Refill filament"
    PAUSE STATE=runout
  {% endif %}
immediate_runout_gcode:
  RESPOND MSG="Ran out of filament, using remaining filament in PTFE"
insert_gcode:
  RESPOND MSG="Filament is inserted"

[led case]
white_pin: PC9
initial_WHITE: 1

[led hotend]
white_pin: hotend:PC9

[fan_generic aux_fan]
pin: PA9

[fan_generic case_fan]
pin: PA8

[temperature_sensor mcu_toolhead]
sensor_type: temperature_mcu
sensor_mcu: hotend

[temperature_sensor mcu_bed]
sensor_type: temperature_mcu
sensor_mcu: bed

[temperature_fan mainboard]
pin: PF0
tachometer_pin: PC13
min_temp: 0
max_temp: 80
target_temp: 60
min_speed: 0
sensor_type: temperature_host
control: pid
pid_Kp: 2
pid_Ki: 5
pid_Kd: 0.5

[screws_tilt_adjust]
screw1: 231, 25
screw1_name: front right screw
screw2: 231, 225
screw2_name: rear right screw
screw3: 31, 225
screw3_name: rear left screw
screw4: 31, 25
screw4_name: front left screw
horizontal_move_z: 5
speed: 300
screw_thread: CCW-M4

[gcode_button extruder_board_detect]
pin: ~hotend:PB12
debounce_delay: 0.05
press_gcode: # CANVAS board detected.
    {% set pulldown_resistor_value = printer.configfile.settings.extruder.pulldown_resistor %}
    {% if pulldown_resistor_value != 100000 %}
        { action_emergency_stop("Fire hazard detected: CANVAS board detected without the pulldown resistor being configured. Please set elegoo_canvas to True in cosmos.conf or manually configure the pulldown_resistor value on the extruder!") }
    {% endif %}
