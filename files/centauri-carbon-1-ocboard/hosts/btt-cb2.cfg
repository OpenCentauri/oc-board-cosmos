# -----
# PLEASE DO NOT EDIT THIS FILE. EDIT printer.cfg INSTEAD.
# UPDATES WILL RESET THIS FILE. YOUR EDITS WILL BE LOST WHEN UPDATING.
# -----

[mcu]
serial: /dev/serial/by-path/platform-xhci-hcd.0.auto-usb-0:1.1:1.0

[mcu bed]
serial: /dev/ttyS0

[mcu hotend]
serial: /dev/serial/by-path/platform-xhci-hcd.0.auto-usb-0:1.3:1.0

[gcode_shell_command RESET_USB]
command: sudo -n /usr/lib/klipper/reset-usb.sh
timeout: 15
verbose: True

[gcode_macro RESET_USB]
description: Rebind the CB2 USB controller; all USB devices disconnect briefly
gcode:
  RUN_SHELL_COMMAND CMD=RESET_USB
