name: Shared Trixie arm64 package build
on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
permissions:
  contents: write
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    concurrency:
      group: apt-channel-build-and-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - name: Load published channel markers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/branches/gh-pages" >/dev/null 2>&1; then
            git fetch origin gh-pages:refs/remotes/origin/gh-pages
          fi
      - name: Select eligible Cosmos revision
        id: source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APT_CHANNEL: ${{ inputs.channel }}
        run: python3 scripts/select-channel.py
      - uses: docker/login-action@v4
        if: steps.source.outputs.build == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refresh builder when inputs change
        if: steps.source.outputs.build == 'true'
        id: image
        run: bash scripts/build-builder.sh
      - name: Restore build caches
        if: steps.source.outputs.build == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/oc-board-cosmos/ccache
            ${{ runner.temp }}/oc-board-cosmos/sccache
            ${{ runner.temp }}/oc-board-cosmos/downloads
            ${{ runner.temp }}/oc-board-cosmos/cargo/registry
            ${{ runner.temp }}/oc-board-cosmos/cargo/git
          key: build-cache-${{ runner.os }}-${{ runner.arch }}-${{ inputs.channel }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            build-cache-${{ runner.os }}-${{ runner.arch }}-${{ inputs.channel }}-
            build-cache-${{ runner.os }}-${{ runner.arch }}-
      - name: Build packages and stage channel
        if: steps.source.outputs.build == 'true'
        env:
          BUILDER_IMAGE: ${{ steps.image.outputs.image }}
          APT_CHANNEL: ${{ inputs.channel }}
          COSMOS_SHA: ${{ steps.source.outputs.sha }}
          PACKAGING_FINGERPRINT: ${{ steps.source.outputs.packaging_fingerprint }}
          COSMOS_RELEASE_ID: ${{ steps.source.outputs.release_id }}
          COSMOS_RELEASE_TAG: ${{ steps.source.outputs.tag }}
          PACKAGE_BUILD_NUMBER: ${{ github.run_number }}
          CACHE_DIR: ${{ runner.temp }}/oc-board-cosmos
        run: bash scripts/build-debs.sh "$COSMOS_SHA"
      - name: Make build caches readable by the runner
        if: success() && steps.source.outputs.build == 'true'
        continue-on-error: true
        run: sudo chown -R "$(id -u):$(id -g)" "${{ runner.temp }}/oc-board-cosmos"
      - name: Save build caches after a successful build
        if: success() && steps.source.outputs.build == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/oc-board-cosmos/ccache
            ${{ runner.temp }}/oc-board-cosmos/sccache
            ${{ runner.temp }}/oc-board-cosmos/downloads
            ${{ runner.temp }}/oc-board-cosmos/cargo/registry
            ${{ runner.temp }}/oc-board-cosmos/cargo/git
          key: build-cache-${{ runner.os }}-${{ runner.arch }}-${{ inputs.channel }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish channel without replacing other channels
        if: steps.source.outputs.build == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish
          keep_files: true
