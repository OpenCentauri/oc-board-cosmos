name: Trixie arm64 apt

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

concurrency:
  group: trixie-arm64-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  builder-image:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether the builder image is current
        id: meta
        run: |
          set -euo pipefail
          base=ghcr.io/armbian/docker-armbian-build:armbian-debian-trixie-latest
          image="ghcr.io/${GITHUB_REPOSITORY,,}:builder"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          docker pull "$base"
          base_digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$base" | awk -F@ '{print $2}')
          echo "Base digest: $base_digest"
          need=true
          if docker pull "$image"; then
            have=$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.base.digest" }}' "$image")
            echo "Published base digest: $have"
            if [ "$have" = "$base_digest" ]; then
              need=false
            fi
          else
            echo "Builder image is not published yet"
          fi
          echo "base_digest=$base_digest" >> "$GITHUB_OUTPUT"
          echo "need_image=$need" >> "$GITHUB_OUTPUT"

      - name: Build and push builder image
        if: steps.meta.outputs.need_image == 'true'
        run: |
          set -euo pipefail
          docker build \
            --build-arg "BASE_DIGEST=${{ steps.meta.outputs.base_digest }}" \
            --tag "${{ steps.meta.outputs.image }}" \
            .
          docker push "${{ steps.meta.outputs.image }}"

  debs:
    needs: builder-image
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Record cosmos main
        id: cosmos
        run: |
          sha=$(git ls-remote https://github.com/OpenCentauri/cosmos.git refs/heads/main | awk '{print $1}')
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Cosmos main: $sha"

      - name: Skip unchanged cosmos SHA
        id: preflight
        run: |
          url="https://opencentauri.github.io/oc-board-cosmos/trixie/arm64/cosmos-sha"
          previous=$(curl -fsSL "$url" || true)
          if [ "$previous" = "${{ steps.cosmos.outputs.sha }}" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "${{ github.event_name }}" != "push" ]; then
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build packages
        if: steps.preflight.outputs.needs_build == 'true'
        env:
          BUILDER_IMAGE: ${{ needs.builder-image.outputs.image }}
        run: bash scripts/build-debs.sh "${{ steps.cosmos.outputs.sha }}"

      - name: Install apt archive tools
        if: steps.preflight.outputs.needs_build == 'true'
        run: sudo apt-get update && sudo apt-get install -y apt-utils

      - name: Stage apt archive
        if: steps.preflight.outputs.needs_build == 'true'
        run: bash scripts/stage-apt.sh "${{ steps.cosmos.outputs.sha }}"

      - name: Publish GitHub Pages
        if: steps.preflight.outputs.needs_build == 'true' && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish
          keep_files: true
