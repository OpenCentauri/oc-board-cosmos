name: Nightly packages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'
permissions:
  contents: write
  packages: write
concurrency:
  group: nightly-packages
  cancel-in-progress: false
jobs:
  build:
    uses: ./.github/workflows/apt-trixie-arm64.yml
    with:
      channel: nightly
    secrets: inherit
